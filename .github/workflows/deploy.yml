name: Deploy ShopLoc-Web-Client CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-webclient-deploy
  cancel-in-progress: false

jobs:
  # ==========================================
  # JOB 1: ASTRO BUILD & VERIFICATION
  # ==========================================
  test-and-build:
    name: Astro Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'shoploc/package-lock.json'

      - name: Install dependencies
        run: |
          cd shoploc
          npm ci

      - name: Build Astro for Production
        run: |
          cd shoploc
          npm run build

  # ==========================================
  # JOB 2: BUILD & PUSH DOCKER ARM64 IMAGE
  # ==========================================
  build-and-push:
    name: Build & Push Docker ARM64 to GHCR
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (ARM64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Lowercase Image Name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ==========================================
  # JOB 3: AUTOMATED DEPLOYMENT TO K3S CLUSTER
  # ==========================================
  deploy:
    name: Rollout Deploy to K3s Cluster
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH into K3s host and rollout restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            cat << 'EOF' > /home/ubuntu/shoploc-poc/shoploc-webclient.yaml
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: shoploc-webclient
              namespace: shoploc
              labels:
                app: shoploc-webclient
            spec:
              replicas: 1
              selector:
                matchLabels:
                  app: shoploc-webclient
              strategy:
                type: RollingUpdate
                rollingUpdate:
                  maxSurge: 1
                  maxUnavailable: 0
              template:
                metadata:
                  labels:
                    app: shoploc-webclient
                spec:
                  imagePullSecrets:
                    - name: ghcr-secret
                  containers:
                    - name: webclient
                      image: ghcr.io/miagecollectivit/shoploc-web-client:latest
                      imagePullPolicy: Always
                      ports:
                        - containerPort: 3000
                          name: http
                      resources:
                        requests:
                          cpu: 25m
                          memory: 64Mi
                        limits:
                          cpu: 250m
                          memory: 256Mi
                      livenessProbe:
                        httpGet:
                          path: /
                          port: 3000
                        initialDelaySeconds: 15
                        periodSeconds: 10
                        timeoutSeconds: 3
                        failureThreshold: 3
                      readinessProbe:
                        httpGet:
                          path: /
                          port: 3000
                        initialDelaySeconds: 5
                        periodSeconds: 5
                        timeoutSeconds: 3
                        failureThreshold: 3
            ---
            apiVersion: v1
            kind: Service
            metadata:
              name: shoploc-webclient
              namespace: shoploc
              labels:
                app: shoploc-webclient
            spec:
              type: ClusterIP
              selector:
                app: shoploc-webclient
              ports:
                - name: http
                  port: 80
                  targetPort: 3000
                  protocol: TCP
            EOF
            kubectl apply -f /home/ubuntu/shoploc-poc/shoploc-webclient.yaml
            kubectl rollout restart deployment/shoploc-webclient -n shoploc
            kubectl rollout status deployment/shoploc-webclient -n shoploc --timeout=180s