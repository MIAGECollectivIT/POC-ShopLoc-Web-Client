services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shoploc-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - API_URL=http://host.docker.internal:8080/api/shops
